[package]
name = "lantern-filesystem"
version = "0.0.0"
edition = "2021"
description = "LanternOS content-addressed filesystem v0 — Phase 2 prototype (RFC-0009/ADR-0014)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "lantern_filesystem"
path = "src/lib.rs"

[features]
default = ["kernel-backend"]
# The `&mut KernelState` broker backend — for host tests and for privileged,
# same-address-space callers. A confined Store running via the `Abi` backend
# needs none of this and can build with `default-features = false` (only
# `lantern-abi`/`lantern-crypto` linked) — RFC-0019/ADR-0024.
kernel-backend = ["dep:lantern-hal", "dep:lantern-kernel", "lantern-capabilities/kernel-backend", "lantern-crypto/kernel-backend"]

[dependencies]
lantern-abi = { git = "https://github.com/lantern-os/lantern-abi", branch = "main" }
lantern-hal = { git = "https://github.com/lantern-os/lantern-hal", branch = "main", optional = true }
lantern-kernel = { git = "https://github.com/lantern-os/lantern-kernel", branch = "main", optional = true }
lantern-capabilities = { git = "https://github.com/lantern-os/lantern-capabilities", branch = "main", default-features = false }
lantern-crypto = { git = "https://github.com/lantern-os/lantern-crypto", branch = "main", default-features = false }
